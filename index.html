<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuraSync - Unlock Your Energetic Blueprint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --aurora-speed: 60s;
      }
      .aurora-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: radial-gradient(ellipse at top, #6366F1, transparent),
                    radial-gradient(ellipse at bottom, #8B5CF6, transparent);
        background-size: 200% 200%;
        animation: aurora var(--aurora-speed) linear infinite;
        filter: blur(80px);
        opacity: 0.6;
      }

      .dark .aurora-background {
         background: radial-gradient(ellipse at top, #1e293b, transparent),
                    radial-gradient(ellipse at bottom, #4f46e5, transparent);
        opacity: 0.5;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
      }
      
      .dark .glass-card {
        background: rgba(20, 20, 40, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      }

      .glow-on-hover:hover {
        box-shadow: 0 0 15px 2px var(--glow-color, #6366F1);
      }

      .defined-channel-flow {
        stroke-dasharray: 10;
        animation: channelFlow 3s linear infinite;
      }

      /* Custom Scrollbar for LifeOS */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
      }

      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
      }

      .dark .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.1);
      }

      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
      }

    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'brand-primary': '#6366F1', // Indigo 500
              'brand-secondary': '#8B5CF6', // Violet 500
              'brand-accent': '#F59E0B', // Amber 500
              'brand-light': '#F8F7FF',
              'brand-dark': '#0f172a', // Slate 900
              'brand-dark-secondary': '#1e293b', // Slate 800
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-in-out',
              'slide-in-up': 'slideInUp 0.5s ease-in-out',
              'spin-slow': 'spin 3s linear infinite',
              'pulse-glow': 'pulseGlow 2.5s ease-in-out infinite',
              'breathing': 'breathing 5s ease-in-out infinite',
              'highlight-pulse': 'highlightPulse 1.5s ease-out',
              'channel-glow': 'channelGlow 2s ease-in-out infinite',
              'aurora': 'aurora 60s linear infinite',
              'energy-flow': 'channelFlow 3s linear infinite',
              'shimmer': 'shimmer 2s infinite linear', // Added shimmer animation
            },
            keyframes: {
              aurora: {
                '0%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
                '100%': { backgroundPosition: '0% 50%' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideInUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              pulseGlow: {
                '0%, 100%': { transform: 'scale(1)', filter: 'brightness(1)' },
                '50%': { transform: 'scale(1.03)', filter: 'brightness(1.2)' },
              },
              breathing: {
                '0%, 100%': { opacity: '0.6' },
                '50%': { opacity: '1' },
              },
              highlightPulse: {
                '0%, 100%': {
                  transform: 'scale(1)',
                  boxShadow: '0 0 0 0 rgba(245, 158, 11, 0)', // brand-accent
                },
                '50%': {
                  transform: 'scale(1.02)',
                  boxShadow: '0 0 12px 6px rgba(245, 158, 11, 0.5)',
                },
              },
              channelGlow: { 
                '0%, 100%': { filter: 'drop-shadow(0 0 1px #F59E0B)' },
                '50%': { filter: 'drop-shadow(0 0 3px #F59E0B)' },
              },
              channelFlow: {
                '0%': { 'stroke-dashoffset': '20' },
                '100%': { 'stroke-dashoffset': '0' },
              },
              shimmer: { // New shimmer animation
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              }
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
    "react/": "https://esm.sh/react@^19.1.0/",
    "react": "https://esm.sh/react@^19.1.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.10.0",
    "firebase/": "https://aistudiocdn.com/firebase@^12.6.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0"
  }
}
</script>
</head>
  <body class="bg-brand-light dark:bg-brand-dark transition-colors duration-300">
    <div class="aurora-background"></div>
    <div id="root"></div>
  </body>
</html>
